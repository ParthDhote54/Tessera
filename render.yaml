services:
  - type: web
    name: tessera-backend
    env: docker
    rootDir: tessera-backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: CORS_ALLOWED_ORIGINS
        value: "https://tessera-frontend-one-eta.vercel.app,http://localhost:5173,http://localhost:3000"
    healthCheckPath: /api/health
